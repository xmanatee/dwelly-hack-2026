[project]
name = "hackathon-solver"
version = "0.0.1"
description = "Hackathon Solver: contest cases -> shared dwelly-bot Planner -> ANSWER/REASONING files"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["dwelly-bot"]

[project.scripts]
hackathon-solver = "hackathon_solver.cli:main"

[tool.uv.sources]
dwelly-bot = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackathon_solver"]

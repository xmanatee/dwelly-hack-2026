const descriptions={"input": ["Каналы продукта", "Звонок, email, SMS или назначенный тикет. Адаптер формирует событие и маршрут ответа."], "trigger": ["Триггер", "Запрос, идентификатор события, корреляция и подсказки для поиска клиента. Адрес отправителя не доказывает личность."], "data": ["Тестовый мир · Никита", "Сущности, таблицы и связи предоставляет Никита. Сборщик подключает согласованный интерфейс источников."], "collector": ["Сбор контекста · продукт", "Собирает доступные факты и историю в один Markdown-текст. Источники, неизвестные значения, ограничения и момент среза сохраняются."], "skills": ["Знания Planner · Вера", "Скиллы, инструкции и выбор применимых процедур — внутри компонента. Их оптимизирует Вера. Публичный вызов принимает только текст."], "planner": ["Planner · продукт · Вера", "text → Plan. Hackathon Solver импортирует этот же компонент. План содержит уже выбранное решение и конкретные действия, включая немедленный ответ или передачу человеку. Бизнес-инструментов здесь нет."], "executor": ["Исполнитель · продукт", "Выполняет выбранные операции и сохраняет подтверждения. Проверяет права и технические условия, но не придумывает бизнес-решение и не перечитывает контекст ради повторного планирования."], "output": ["Результат в канал", "Подтверждённый результат возвращается в звонок, сообщение или тикет. Намерение передать оператору ещё не означает состоявшуюся передачу."], "cases": ["Кейсы · вход Hackathon Solver", "Исходные кейсы сохраняются без изменения. Ответы, разметка и ретроспективные исходы доступны только оценке."], "test": ["Подготовка контекста · Solver", "Адаптер выбирает момент решения и доступную тогда историю и вложения. Удерживает будущие исходы и ответы. Передаёт один текст импортированному Planner."], "generate": ["Генератор ответа · Solver · Вера", "Plan и при необходимости тот же видимый контекст → answer / reasoning. Возможен отдельный LLM-вызов. Генератор сохраняет решение, не добавляет фактов и не объявляет действия выполненными."], "export": ["Два файла · Solver", "Writer сохраняет ANSWER.md и REASONING.md в формате сдачи. Исходный Plan и вызов генератора сохраняются рядом в трассе."], "judge": ["Оценка · Solver", "Отдельно оценивает решение, верность генерации и итоговый ответ. При сравнении Planner фиксируем генератор; при сравнении генератора используем одинаковые сохранённые планы."], "optimize": ["Оптимизация · Вера", "Меняем скиллы, инструкции и конфигурацию Planner либо генератор в отдельном эксперименте. Оценка не попадает в контекст текущего кейса. Нужен новый baseline на контракте text → Plan."]};
const panel=document.querySelector('.inspector');
function inspect(el){const [title,body]=descriptions[el.dataset.node];panel.querySelector('h1').textContent=title;panel.querySelector('p').textContent=body;panel.hidden=false;document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');}
document.querySelectorAll('[data-node]').forEach(el=>{el.addEventListener('click',()=>inspect(el));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inspect(el)}})});
document.querySelector('.close').onclick=()=>{panel.hidden=true;document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'))};
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{const mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('.canvas .node,.canvas .edge,.canvas .rail,.canvas .competition-rail').forEach(el=>{const visible=mode==='all'||el.classList.contains('shared')||el.classList.contains(mode)||(mode==='learning'&&el.classList.contains('competition'));el.classList.toggle('dim',!visible)});panel.hidden=true;}));
</script></html>
